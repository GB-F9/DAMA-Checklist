            { id: 'p5-v7', text: 'Pay visa fee (~AUD $4,640 primary applicant)' },
            { id: 'p5-v8', text: 'Submit 186 application via ImmiAccount' },
            { id: 'p5-v9', text: 'Await PR grant' }
          ]
        },
        {
          title: 'Post-PR (after grant)',
          items: [
            { id: 'p5-pr1', text: 'PR visa granted — Permanent Resident of Australia 🎉' },
            { id: 'p5-pr2', text: 'Update Medicare to full coverage' },
            { id: 'p5-pr3', text: 'Sponsor remaining family members if not already with her' },
            { id: 'p5-pr4', text: 'Track Australian residency days for citizenship' },
            { id: 'p5-pr5', text: 'Apply for Australian citizenship after 4 years residency (incl. 1 year as PR)' }
          ]
        }
      ]
    },
    {
      id: 'pb',
      title: 'Budget Planning',
      meta: 'Estimated personal costs | Pre-arrival to PR',
      sections: [
        {
          title: 'Pre-Application Costs (Phase 1)',
          items: [
            { id: 'pb-1', text: 'OET test fee — ~AUD $587 (~PHP 18,000)' },
            { id: 'pb-2', text: 'OET prep materials / online courses — ~AUD $200–500' },
            { id: 'pb-3', text: 'Document authentication / notarisation — ~AUD $200' },
            { id: 'pb-4', text: 'NBI Clearance + apostille — ~AUD $50' },
            { id: 'pb-5', text: 'Qatar police clearance via embassy — ~AUD $80' },
            { id: 'pb-6', text: 'Updated passport photos — ~AUD $20' }
          ]
        },
        {
          title: 'Application & Visa Costs (Phase 3)',
          items: [
            { id: 'pb-7', text: 'Skills assessment (Community Work Australia) — ~AUD $400–600' },
            { id: 'pb-8', text: 'Visa subclass 482 fee — ~AUD $3,210', detail: 'Often paid by employer under ACILA — confirm in offer' },
            { id: 'pb-9', text: 'Health examinations — ~AUD $400' },
            { id: 'pb-10', text: 'Migration agent (optional) — ~AUD $2,000–5,000' }
          ]
        },
        {
          title: 'Relocation Costs (Phase 3 → 4)',
          items: [
            { id: 'pb-11', text: 'One-way flight Manila to Australia — ~AUD $800–1,200' },
            { id: 'pb-12', text: 'First month accommodation buffer — ~AUD $2,000' },
            { id: 'pb-13', text: 'Living costs first month (food, transport, SIM) — ~AUD $2,500' },
            { id: 'pb-14', text: 'Initial Australian wardrobe (uniforms, cool-weather clothing if VIC/SA) — ~AUD $300' }
          ]
        },
        {
          title: 'PR Stage (Phase 5, Year 2+)',
          items: [
            { id: 'pb-15', text: 'Visa subclass 186 fee — ~AUD $4,640' },
            { id: 'pb-16', text: 'Renewed health + police checks — ~AUD $500' }
          ]
        }
      ]
    }
  ];

  var state = {};

  function loadState() {
    try {
      var saved = localStorage.getItem(STORAGE_KEY);
      if (saved) state = JSON.parse(saved);
    } catch (e) { state = {}; }
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) { console.warn('Save failed', e); }
  }

  function getItemState(id) {
    return state[id] || { done: false, note: '' };
  }

  function setItemState(id, patch) {
    var cur = getItemState(id);
    state[id] = { done: cur.done, note: cur.note };
    if (patch.done !== undefined) state[id].done = patch.done;
    if (patch.note !== undefined) state[id].note = patch.note;
    saveState();
    updateProgress();
  }

  function countItems() {
    var total = 0, done = 0;
    for (var i = 0; i < data.length; i++) {
      for (var j = 0; j < data[i].sections.length; j++) {
        var items = data[i].sections[j].items;
        for (var k = 0; k < items.length; k++) {
          total++;
          if (getItemState(items[k].id).done) done++;
        }
      }
    }
    return { total: total, done: done };
  }

  function countPhase(phase) {
    var total = 0, done = 0;
    for (var j = 0; j < phase.sections.length; j++) {
      var items = phase.sections[j].items;
      for (var k = 0; k < items.length; k++) {
        total++;
        if (getItemState(items[k].id).done) done++;
      }
    }
    return { total: total, done: done };
  }

  function updateProgress() {
    var c = countItems();
    var pct = c.total === 0 ? 0 : Math.round((c.done / c.total) * 100);
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressLabel').textContent = c.done + ' of ' + c.total + ' complete';
    document.getElementById('progressPct').textContent = pct + '%';

    // Update phase stats
    for (var i = 0; i < data.length; i++) {
      var phase = data[i];
      var pc = countPhase(phase);
      var statEl = document.getElementById('stat-' + phase.id);
      var phaseEl = document.getElementById('phase-' + phase.id);
      if (statEl) statEl.textContent = pc.done + '/' + pc.total;
      if (phaseEl) {
        if (pc.done === pc.total && pc.total > 0) phaseEl.classList.add('complete');
        else phaseEl.classList.remove('complete');
      }
    }
  }

  function toggleItem(id) {
    var cur = getItemState(id);
    setItemState(id, { done: !cur.done });
    var el = document.getElementById('item-' + id);
    var cb = document.getElementById('cb-' + id);
    if (cur.done) {
      el.classList.remove('done');
      cb.classList.remove('checked');
    } else {
      el.classList.add('done');
      cb.classList.add('checked');
    }
  }

  function toggleNote(id) {
    var el = document.getElementById('item-' + id);
    el.classList.toggle('has-note');
    if (el.classList.contains('has-note')) {
      var ta = document.getElementById('note-' + id);
      if (ta) ta.focus();
    }
  }

  function updateNote(id, value) {
    setItemState(id, { note: value });
  }

  function togglePhase(id) {
    var el = document.getElementById('phase-' + id);
    el.classList.toggle('expanded');
  }

  function expandAll() {
    var els = document.querySelectorAll('.phase');
    var anyCollapsed = false;
    for (var i = 0; i < els.length; i++) {
      if (!els[i].classList.contains('expanded')) { anyCollapsed = true; break; }
    }
    for (var i = 0; i < els.length; i++) {
      if (anyCollapsed) els[i].classList.add('expanded');
      else els[i].classList.remove('expanded');
    }
  }

  function resetAll() {
    if (confirm('Reset all progress? This will uncheck every item and clear all notes. This cannot be undone.')) {
      state = {};
      saveState();
      render();
    }
  }

  function exportData() {
    var lines = ['DAMA / ACILA PR Pathway Checklist — Export'];
    lines.push('Date: ' + new Date().toLocaleDateString());
    var c = countItems();
    lines.push('Progress: ' + c.done + ' of ' + c.total + ' (' + Math.round(c.done/c.total*100) + '%)');
    lines.push('');
    for (var i = 0; i < data.length; i++) {
      var phase = data[i];
      lines.push('=== ' + phase.title + ' ===');
      for (var j = 0; j < phase.sections.length; j++) {
        var sec = phase.sections[j];
        lines.push('');
        lines.push('-- ' + sec.title + ' --');
        for (var k = 0; k < sec.items.length; k++) {
          var item = sec.items[k];
          var s = getItemState(item.id);
          lines.push((s.done ? '[x] ' : '[ ] ') + item.text);
          if (s.note) lines.push('     Note: ' + s.note);
        }
      }
      lines.push('');
    }
    var blob = new Blob([lines.join('\n')], { type: 'text/plain' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'dama-pr-checklist-' + new Date().toISOString().slice(0,10) + '.txt';
    a.click();
    URL.revokeObjectURL(url);
  }

  function render() {
    var root = document.getElementById('checklist');
    var html = '';
    for (var i = 0; i < data.length; i++) {
      var phase = data[i];
      html += '<div class="phase' + (i === 0 ? ' expanded' : '') + '" id="phase-' + phase.id + '">';
      html += '<div class="phase-header" onclick="togglePhase(\'' + phase.id + '\')">';
      html += '<div style="flex:1">';
      html += '<div class="phase-title">' + phase.title + '</div>';
      html += '<div class="phase-meta">' + phase.meta + '</div>';
      html += '</div>';
      html += '<span class="phase-stats" id="stat-' + phase.id + '">0/0</span>';
      html += '<span class="chevron">&#9656;</span>';
      html += '</div>';
      html += '<div class="phase-body">';
      for (var j = 0; j < phase.sections.length; j++) {
        var sec = phase.sections[j];
        html += '<div class="section">';
        html += '<div class="section-title">' + sec.title + '</div>';
        for (var k = 0; k < sec.items.length; k++) {
          var item = sec.items[k];
          var s = getItemState(item.id);
          var hasNoteClass = s.note ? ' has-note' : '';
          var doneClass = s.done ? ' done' : '';
          var checkedClass = s.done ? ' checked' : '';
          html += '<div class="item' + doneClass + hasNoteClass + '" id="item-' + item.id + '">';
          html += '<div class="checkbox' + checkedClass + '" id="cb-' + item.id + '" onclick="toggleItem(\'' + item.id + '\')"></div>';
          html += '<div class="item-content">';
          html += '<div class="item-text" onclick="toggleItem(\'' + item.id + '\')">' + item.text + '</div>';
          if (item.detail) html += '<div class="item-detail">' + item.detail + '</div>';
          html += '<button class="note-toggle" onclick="toggleNote(\'' + item.id + '\')">' + (s.note ? 'Edit note' : '+ Add note') + '</button>';
          html += '<textarea class="item-note" id="note-' + item.id + '" placeholder="Add details, dates, contacts..." onblur="updateNote(\'' + item.id + '\', this.value)">' + (s.note || '') + '</textarea>';
          html += '</div></div>';
        }
        html += '</div>';
      }
      html += '</div></div>';
    }
    root.innerHTML = html;
    updateProgress();
  }

  loadState();
  render();
</script>
</body>
</html>
